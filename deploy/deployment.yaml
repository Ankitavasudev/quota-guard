apiVersion: v1
kind: Namespace
metadata:
  name: quota-guard-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-guard
  namespace: quota-guard-system
  labels:
    app.kubernetes.io/name: quota-guard
    app.kubernetes.io/part-of: quota-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quota-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quota-guard
    spec:
      serviceAccountName: quota-guard
      containers:
        - name: quota-guard
          image: ghcr.io/ankitavasudev/quota-guard:latest
          args: ["--metrics-bind-address=:8080"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quota-guard-metrics
  namespace: quota-guard-system
  labels:
    app.kubernetes.io/name: quota-guard
spec:
  selector:
    app.kubernetes.io/name: quota-guard
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
