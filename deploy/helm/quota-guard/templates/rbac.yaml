{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quota-guard.fullname" . }}
rules:
  - apiGroups: ["guard.ankaita.dev"]
    resources: ["resourcebudgets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["guard.ankaita.dev"]
    resources: ["resourcebudgets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "quota-guard.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "quota-guard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "quota-guard.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end -}}