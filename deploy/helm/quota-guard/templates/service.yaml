apiVersion: v1
kind: Service
metadata:
  name: {{ include "quota-guard.fullname" . }}-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "quota-guard.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "quota-guard.name" . }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics